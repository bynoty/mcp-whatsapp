name: Build Windows Binary

on:
  workflow_dispatch: # เปิดให้กดสั่งรันเองได้ตลอดเวลา
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build whatsapp-mcp.exe with CGO
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"
          go build -v -ldflags="-s -w" -o whatsapp-mcp.exe ./cmd/whatsapp-mcp

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-mcp-windows-amd64
          path: whatsapp-mcp.exe
